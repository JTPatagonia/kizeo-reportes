<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Central de Monitoreo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #e0e0e0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { background-color: #1e1e1e; border: 1px solid #333; border-radius: 10px; width: 100%; max-width: 400px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .form-control { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus { background-color: #2a2a2a; border-color: #0d6efd; color: #fff; box-shadow: none; }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved text-danger fa-3x mb-2"></i>
            <h4 class="fw-bold text-light">CENTRAL DE MONITOREO</h4>
            <p class="text-muted small">Inicie sesión con su usuario de turno</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small text-center" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" required autocomplete="off" autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold shadow">
                <i class="fa-solid fa-right-to-bracket me-2"></i> INGRESAR AL TURNO
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted" style="font-size: 11px;">Credencial por defecto: <b>admin</b> / <b>admin2026</b></small>
        </div>
    </div>
</body>
</html>
